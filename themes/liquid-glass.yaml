# Liquid Glass — Home Assistant + card-mod 4.2+, Mushroom 5+, Bubble Card 3.3+.
# Select this theme in your profile and set color mode to Auto.
Liquid Glass:
  card-mod-theme: Liquid Glass

  # One material: frosted, translucent glass with a bright specular rim. The
  # soft-shadow-* names are kept so liquid-glass-press.js works unchanged
  # (inset = the pressed/recessed state). Tune glass-blur for frost.
  soft-radius: 26px
  soft-control-radius: 16px
  glass-blur: blur(24px) saturate(180%)
  soft-shadow-raised: 0 8px 32px var(--soft-shadow-dark), inset 0 1px 0 var(--soft-shadow-light), inset 0 0 0 1px var(--glass-edge)
  soft-shadow-small: 0 2px 10px var(--soft-shadow-dark), inset 0 1px 0 var(--soft-shadow-light)
  soft-shadow-inset: inset 0 2px 6px var(--soft-shadow-dark), inset 0 -1px 0 var(--soft-shadow-light)
  # How far a ± control rocks toward the pressed side (needs liquid-glass-press.js).
  soft-rocker-tilt: 12deg
  soft-rocker-perspective: 150cqw

  # Home Assistant surfaces, including the current semantic color system.
  # Page, sidebar and menu colours are opaque (soft-*): nothing sits behind
  # them to blur, and a translucent page shows the browser canvas. Cards and
  # controls use the translucent glass-* fills over lovelace-background.
  primary-background-color: var(--soft-surface)
  secondary-background-color: var(--soft-surface)
  # card-background-color also paints ha-dropdown menus, which have no blur.
  card-background-color: var(--soft-surface)
  clear-background-color: var(--soft-surface)
  lovelace-background: var(--glass-backdrop)
  ha-card-background: var(--glass-fill)
  # HA's own hooks: ha-card, ha-badge and Mushroom badges/chips read this.
  ha-card-backdrop-filter: var(--glass-blur)
  ha-card-box-shadow: var(--soft-shadow-raised)
  ha-card-border-radius: var(--soft-radius)
  ha-card-border-width: 1px
  ha-card-border-color: var(--glass-edge)
  ha-card-header-color: var(--primary-text-color)
  ha-card-header-font-size: 20px
  ha-color-surface-default: var(--soft-surface)
  ha-color-surface-low: var(--soft-surface)
  ha-color-surface-lower: var(--soft-recess)
  ha-color-on-surface-default: var(--primary-text-color)
  ha-color-text-primary: var(--primary-text-color)
  ha-color-text-secondary: var(--secondary-text-color)
  ha-color-text-disabled: var(--disabled-text-color)
  ha-color-text-link: var(--primary-color)
  ha-color-focus: var(--primary-color)
  ha-color-border-neutral-quiet: var(--divider-color)
  ha-color-border-neutral-normal: var(--soft-control-edge)
  ha-color-border-neutral-loud: var(--secondary-text-color)
  ha-color-fill-neutral-quiet-resting: var(--glass-fill)
  ha-color-fill-neutral-quiet-hover: var(--glass-recess)
  ha-color-fill-neutral-quiet-active: var(--glass-recess)
  ha-color-fill-neutral-normal-resting: var(--glass-recess)
  ha-color-fill-neutral-normal-hover: var(--glass-recess)
  ha-color-fill-neutral-normal-active: var(--glass-recess)
  ha-color-on-neutral-quiet: var(--secondary-text-color)
  ha-color-on-neutral-normal: var(--primary-text-color)
  ha-color-form-background: var(--glass-recess)
  ha-color-form-background-hover: var(--glass-recess)
  ha-color-form-background-disabled: var(--glass-fill)
  ha-color-fill-primary-quiet-resting: var(--glass-active)
  ha-color-fill-primary-quiet-hover: var(--glass-active)
  ha-color-fill-primary-quiet-active: var(--glass-active)
  ha-color-fill-primary-normal-resting: var(--glass-active)
  ha-color-fill-primary-normal-hover: var(--glass-active)
  ha-color-fill-primary-normal-active: var(--glass-active)
  ha-color-fill-primary-loud-resting: var(--primary-color)
  ha-color-fill-primary-loud-hover: var(--primary-color)
  ha-color-fill-primary-loud-active: var(--primary-color)
  ha-color-on-primary-quiet: var(--primary-color)
  ha-color-on-primary-normal: var(--primary-color)
  ha-color-on-primary-loud: var(--text-primary-color)
  ha-color-border-primary-loud: var(--primary-color)
  ha-section-grid-row-gap: 20px
  ha-section-grid-column-gap: 20px
  horizontal-stack-card-margin: 0 8px
  vertical-stack-card-margin: 10px 0

  # App chrome and dialogs use the same material as dashboard cards.
  # Opaque on settings sub-pages (no blur there); card-mod-root turns the
  # dashboard toolbar into glass, where hui-root's .header blurs natively.
  app-header-background-color: var(--soft-surface)
  app-header-backdrop-filter: var(--glass-blur)
  app-header-text-color: var(--primary-text-color)
  app-header-selection-bar-color: var(--primary-color)
  sidebar-background-color: var(--soft-surface)
  sidebar-text-color: var(--primary-text-color)
  sidebar-icon-color: var(--secondary-text-color)
  sidebar-selected-background-color: var(--glass-active)
  sidebar-selected-text-color: var(--primary-color)
  sidebar-selected-icon-color: var(--primary-color)
  ha-dialog-surface-background: var(--glass-fill)
  ha-dialog-border-radius: 28px
  ha-dialog-surface-backdrop-filter: var(--glass-blur)
  mdc-dialog-scrim-color: var(--soft-scrim)
  paper-listbox-background-color: var(--soft-surface)
  paper-item-icon-color: var(--secondary-text-color)
  paper-item-icon-active-color: var(--primary-color)
  state-icon-color: var(--secondary-text-color)
  state-icon-active-color: var(--primary-color)
  state-active-color: var(--primary-color)
  state-inactive-color: var(--secondary-text-color)
  state-unavailable-color: var(--disabled-text-color)
  # Keep domain-specific safety/HVAC colors from Home Assistant.
  state-switch-active-color: var(--primary-color)
  state-input_boolean-active-color: var(--primary-color)
  state-light-active-color: var(--warning-color)
  state-lock-locked-color: var(--success-color)
  state-lock-unlocked-color: var(--error-color)

  # Form controls: current HA variables plus legacy custom-card fallbacks.
  input-fill-color: var(--glass-recess)
  input-disabled-fill-color: var(--glass-fill)
  input-ink-color: var(--primary-text-color)
  input-label-ink-color: var(--secondary-text-color)
  input-dropdown-icon-color: var(--secondary-text-color)
  input-idle-line-color: var(--soft-control-edge)
  input-hover-line-color: var(--primary-color)
  input-outlined-idle-border-color: var(--soft-control-edge)
  input-outlined-hover-border-color: var(--primary-color)
  ha-switch-background-color: var(--glass-recess)
  ha-switch-border-color: var(--soft-control-edge)
  ha-switch-thumb-background-color: var(--secondary-text-color)
  ha-switch-thumb-box-shadow: var(--soft-shadow-small)
  ha-switch-checked-background-color: var(--primary-color)
  ha-switch-checked-border-color: var(--primary-color)
  ha-switch-checked-thumb-background-color: var(--text-primary-color)
  ha-switch-min-touch-size: 44px
  switch-checked-button-color: var(--text-primary-color)
  switch-checked-track-color: var(--primary-color)
  switch-unchecked-button-color: var(--secondary-text-color)
  switch-unchecked-track-color: var(--glass-recess)
  slider-color: var(--primary-color)
  slider-track-color: var(--glass-recess)
  ha-slider-track-color: var(--glass-recess)
  ha-slider-thumb-color: var(--primary-color)
  ha-slider-track-size: 8px
  ha-tile-icon-border-radius: 50%
  ha-assist-chip-container-shape: 22px
  ha-assist-chip-container-color: var(--glass-fill)
  ha-assist-chip-filled-container-color: var(--glass-fill)
  ha-assist-chip-active-container-color: var(--glass-active)
  ha-badge-size: 44px
  ha-badge-border-radius: 22px

  # ha-control-* family: thermostat card, modern more-info controls, and tile
  # card features. Defaults paint a translucent grey wash; give them solid
  # recessed troughs and the accent for the active fill instead.
  control-button-background-color: var(--glass-fill)
  control-button-background-opacity: "1"
  control-button-border-radius: var(--soft-control-radius)
  control-button-icon-color: var(--primary-text-color)
  control-button-focus-color: var(--primary-color)
  control-number-buttons-background-color: var(--glass-fill)
  control-number-buttons-background-opacity: "1"
  control-number-buttons-border-radius: var(--soft-control-radius)
  control-number-buttons-focus-color: var(--primary-color)
  control-slider-color: var(--primary-color)
  control-slider-background: var(--glass-recess)
  control-slider-background-opacity: "1"
  control-slider-border-radius: var(--soft-control-radius)
  control-circular-slider-color: var(--primary-color)
  control-circular-slider-background: var(--glass-recess)
  control-circular-slider-background-opacity: "1"
  control-select-color: var(--primary-color)
  control-select-background: var(--glass-recess)
  control-select-background-opacity: "1"
  control-select-border-radius: var(--soft-control-radius)
  control-select-thickness: 44px

  # Mushroom classic cards, chips, and controls. New template cards use HA tiles.
  mush-spacing: 12px
  mush-card-primary-color: var(--primary-text-color)
  mush-card-secondary-color: var(--secondary-text-color)
  mush-card-primary-font-size: 14px
  mush-card-secondary-font-size: 12px
  mush-icon-border-radius: 50%
  mush-control-border-radius: var(--soft-control-radius)
  mush-control-height: 44px
  mush-chip-height: 44px
  mush-chip-spacing: 12px
  mush-chip-border-radius: 22px
  mush-chip-background: var(--glass-fill)
  mush-chip-border-width: 1px
  mush-chip-border-color: var(--glass-edge)
  mush-chip-box-shadow: var(--soft-shadow-small)
  mush-rgb-state-entity: var(--rgb-primary-color)
  mush-rgb-state-number: var(--rgb-primary-color)
  mush-rgb-state-light: var(--rgb-warning-color)
  mush-rgb-disabled: var(--rgb-secondary-text-color)

  # Bubble's public variables cover its full card family and portalled menus.
  bubble-main-background-color: var(--glass-fill)
  bubble-secondary-background-color: var(--glass-fill)
  bubble-accent-color: var(--primary-color)
  bubble-button-accent-color: var(--glass-active)
  bubble-border-radius: 24px
  bubble-border: 1px solid var(--glass-edge)
  bubble-box-shadow: var(--soft-shadow-small)
  bubble-icon-background-color: var(--glass-fill)
  bubble-icon-border-radius: 50%
  bubble-sub-button-background-color: var(--glass-fill)
  bubble-sub-button-border-radius: 16px
  bubble-main-buttons-background-color: var(--glass-fill)
  bubble-media-player-button-background-color: var(--glass-fill)
  bubble-media-player-slider-background-color: var(--glass-recess)
  bubble-media-player-play-pause-icon-color: var(--text-primary-color)
  bubble-cover-button-background-color: var(--glass-fill)
  bubble-climate-button-background-color: var(--glass-fill)
  bubble-select-list-background-color: var(--soft-surface)
  bubble-select-list-border-radius: 18px
  bubble-select-list-item-accent-color: var(--glass-active)
  bubble-pop-up-main-background-color: var(--glass-fill)
  bubble-pop-up-border-radius: 28px
  bubble-pop-up-border: 1px solid var(--glass-edge)
  bubble-backdrop-background-color: var(--soft-scrim)
  bubble-line-background-color: var(--divider-color)
  bubble-horizontal-buttons-stack-background-color: var(--glass-fill)
  # Bubble's shared .bubble-container rule (bubble-box-shadow / bubble-main-
  # background-color above) applies to every card type, separators included;
  # the separator's own stylesheet only zeroes its border, not the shadow or
  # fill, so it otherwise keeps the raised-pill look. These card-type-scoped
  # variables (bubble-card's own naming convention) opt separators out.
  bubble-separator-box-shadow: none
  bubble-separator-main-background-color: transparent

  # Public component surfaces work on a fresh HA session. Avoid card-mod's
  # *-yaml loader: card-mod 4.2.1 cannot bootstrap it on HA 2026.9.
  card-mod-card: |
    ha-card {
      transition: background-color 160ms ease, box-shadow 160ms ease;
    }
    /* Transparent wrapper cards must not frost their whole box: that draws a
       blurred rectangle and leaves the chips/pills inside nothing to sample.
       Mushroom chips blur themselves (their ha-card reads
       ha-card-backdrop-filter); Bubble's visible pill is .bubble-container. */
    ha-card:is(.type-custom-mushroom-chips-card, .type-custom-bubble-card) {
      -webkit-backdrop-filter: none !important;
      backdrop-filter: none !important;
    }
    .bubble-container:not(:has(.bubble-line)) {
      -webkit-backdrop-filter: var(--glass-blur);
      backdrop-filter: var(--glass-blur);
    }
    :is(button,[role="button"],a,input,select,textarea):focus-visible {
      outline: 2px solid var(--primary-color) !important;
      outline-offset: -2px;
    }
    /* Momentary feedback only: :active releases with the pointer/key.
       Do not use the cards' .active class, which means the entity is on. */
    :is(button, [role="button"], a[href], ha-button, ha-icon-button,
        ha-control-button, mushroom-button, ha-tile-icon):not(:disabled):not([disabled]):not([aria-disabled="true"]):active,
    ha-button:not([disabled]):active::part(base),
    ha-card.action:active,
    ha-card:has(ha-tile-container:active),
    ha-card:has(mushroom-state-item:active),
    ha-card:is(.type-action, .type-entity, .type-template, .type-light,
        .type-menu, .type-back, .type-quickbar):active {
      box-shadow: var(--soft-shadow-inset) !important;
      transition: none !important;
    }
    ha-card:has(mushroom-state-item:active) mushroom-shape-icon {
      box-shadow: var(--soft-shadow-inset);
    }
    /* Bubble paints its own surface; leave separator/wrapper cards flat. */
    .bubble-icon-container, .bubble-sub-button:not(.background-off),
    .bubble-button:not(.bubble-wrapper), .bubble-media-button, .bubble-climate-button {
      box-shadow: var(--soft-shadow-small);
    }
    .bubble-container:has(.bubble-action-enabled:active),
    .bubble-icon-container:active, .bubble-button:active,
    .bubble-sub-button:active, .bubble-media-button:active,
    .bubble-climate-button:active, .bubble-close-button:active,
    .bubble-container:has(.bubble-background:active) {
      box-shadow: var(--soft-shadow-inset) !important;
      transition: none !important;
    }
    /* Accent-filled play button: the surface-coloured inset smudges the teal,
       so press it with neutral shade/highlight instead. The press module reads
       this per-element value too. */
    .bubble-play-pause-button {
      --soft-shadow-inset: inset 0 2px 6px rgba(0, 0, 0, 0.35), inset 0 -1px 0 rgba(255, 255, 255, 0.3);
    }
    .bubble-range-slider, .bubble-sub-button-slider {
      box-shadow: var(--soft-shadow-inset);
    }
    .bubble-pop-up-background {
      background-color: var(--glass-fill) !important;
    }
    .bubble-pop-up { --custom-popup-filter: var(--glass-blur); }
    .bubble-pop-up.is-popup-opened {
      box-shadow: var(--soft-shadow-raised);
    }
    .bubble-state { opacity: 1; }
    .bubble-sub-button { --bubble-accent-color: var(--glass-active); }
    /* Do not suppress scrolling/visibility logic in Bubble's pop-ups. */
    @media (prefers-reduced-motion: reduce) {
      ha-card, .bubble-wrapper, .bubble-background, .bubble-icon-container {
        transition: none !important;
      }
      .scrolling-container span { animation: none !important; }
    }

    /* Style public custom-element surfaces without a YAML shadow-DOM loader.
       ponytail: internal canvas/iframe pixels keep their own design; add an
       upstream theme hook if a particular card needs deeper customization. */
    mushroom-shape-icon, ha-tile-icon {
      border-radius: 50%;
      box-shadow: var(--soft-shadow-small);
    }
    mushroom-button,
    ha-control-button {
      border-radius: var(--soft-control-radius);
      box-shadow: var(--soft-shadow-small);
    }
    mushroom-button:active,
    ha-control-button:active {
      box-shadow: var(--soft-shadow-inset);
    }
    /* Thermostat card + modern more-info controls: recessed troughs. The
       circular slider is an SVG stroke, so its solid recess colour (set via
       the control-circular-slider-* variables above) is the achievable depth.
       ± number controls (Mushroom rockers, HA's numeric feature) are raised
       instead, styled from liquid-glass-press.js. */
    ha-control-select, ha-control-slider {
      border-radius: var(--soft-control-radius);
      box-shadow: var(--soft-shadow-inset);
    }
    mushroom-light-brightness-control,
    mushroom-light-color-temp-control,
    mushroom-light-color-control,
    mushroom-cover-position-control,
    mushroom-cover-tilt-position-control,
    mushroom-fan-percentage-control,
    mushroom-media-player-volume-control,
    mushroom-humidifier-humidity-control,
    hui-card-features {
      border-radius: var(--soft-control-radius);
      box-shadow: var(--soft-shadow-inset);
    }
    ha-slider::part(track), ha-switch::part(control) {
      box-shadow: var(--soft-shadow-inset);
    }
    ha-textfield, ha-select {
      border-radius: var(--soft-control-radius);
      box-shadow: var(--soft-shadow-inset);
    }
    /* State-dependent text/icon colors are supplied by the cards themselves. */
    @media (prefers-reduced-motion: reduce) {
      mushroom-shape-icon, mushroom-button, ha-tile-icon {
        transition: none !important;
        transform: none !important;
      }
    }

  # Reuse the same native-button rules in rows, view headers, and app chrome.
  card-mod-row: &soft-button-surfaces |
    :is(button, [role="button"], a[href], ha-button, ha-icon-button,
        ha-control-button):not(:disabled):not([disabled]):not([aria-disabled="true"]):active,
    ha-button:not([disabled]):active::part(base) {
      box-shadow: var(--soft-shadow-inset) !important;
      transition: none !important;
    }
    ha-slider::part(track), ha-switch::part(control) {
      box-shadow: var(--soft-shadow-inset);
    }
    ha-textfield, ha-select {
      border-radius: var(--soft-control-radius);
      box-shadow: var(--soft-shadow-inset);
    }
  # Dashboard toolbar: translucent glass over the scrolling view.
  card-mod-root: |
    :host { --app-header-background-color: var(--glass-fill); }
    :is(button, [role="button"], a[href], ha-button, ha-icon-button,
        ha-control-button):not(:disabled):not([disabled]):not([aria-disabled="true"]):active,
    ha-button:not([disabled]):active::part(base) {
      box-shadow: var(--soft-shadow-inset) !important;
      transition: none !important;
    }
    ha-slider::part(track), ha-switch::part(control) {
      box-shadow: var(--soft-shadow-inset);
    }
    ha-textfield, ha-select {
      border-radius: var(--soft-control-radius);
      box-shadow: var(--soft-shadow-inset);
    }
  card-mod-view: *soft-button-surfaces

  card-mod-badge: |
    :host { --ha-card-box-shadow: var(--soft-shadow-small); }
    .badge[role="button"]:active {
      box-shadow: var(--soft-shadow-inset) !important;
      transition: none !important;
    }
    .badge:focus-visible { outline: 2px solid var(--primary-color) !important; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .badge { transition: none !important; } }

  card-mod-assist-chip: |
    :host { box-shadow: var(--soft-shadow-small); border-radius: 22px; }
    :host(:not([disabled]):active) { box-shadow: var(--soft-shadow-inset) !important; transition: none !important; }

  modes:
    light:
      # soft-surface/recess/active are the opaque colours the glass reads as
      # over the backdrop; they anchor the contrast checks and fallbacks.
      soft-surface: "#e6eefa"
      soft-recess: "#d9e4f4"
      soft-active-surface: "#cfe6f1"
      glass-fill: "rgba(255, 255, 255, 0.46)"
      glass-recess: "rgba(255, 255, 255, 0.28)"
      glass-active: "rgba(0, 122, 255, 0.18)"
      glass-edge: "rgba(255, 255, 255, 0.55)"
      glass-backdrop: "radial-gradient(circle at 15% 10%, #ffd6e8 0, transparent 45%), radial-gradient(circle at 85% 20%, #b9d8ff 0, transparent 50%), radial-gradient(circle at 50% 95%, #c9f2e3 0, transparent 55%), #e9eefb"
      soft-shadow-dark: "rgba(31, 45, 100, 0.18)"
      soft-shadow-light: "rgba(255, 255, 255, 0.85)"
      soft-control-edge: "#788695"
      soft-scrim: "rgba(27, 39, 51, 0.38)"
      primary-color: "#0062cc"
      accent-color: "#0062cc"
      primary-text-color: "#14202f"
      secondary-text-color: "#526173"
      text-primary-color: "#ffffff"
      disabled-text-color: "#788695"
      disabled-color: "#788695"
      divider-color: "#c2ccd6"
      outline-color: "#788695"
      outline-hover-color: "#526173"
      error-color: "#b53243"
      warning-color: "#8c5700"
      success-color: "#216f45"
      info-color: "#1768a1"
      rgb-primary-color: "0, 98, 204"
      rgb-accent-color: "0, 98, 204"
      rgb-primary-text-color: "20, 32, 47"
      rgb-secondary-text-color: "82, 97, 115"
      rgb-text-primary-color: "255, 255, 255"
      rgb-card-background-color: "255, 255, 255"
      rgb-error-color: "181, 50, 67"
      rgb-warning-color: "140, 87, 0"
      rgb-success-color: "33, 111, 69"
      rgb-info-color: "23, 104, 161"
    dark:
      soft-surface: "#252d3d"
      soft-recess: "#1e2533"
      soft-active-surface: "#27476b"
      glass-fill: "rgba(44, 56, 80, 0.52)"
      glass-recess: "rgba(20, 26, 40, 0.45)"
      glass-active: "rgba(10, 132, 255, 0.28)"
      glass-edge: "rgba(255, 255, 255, 0.16)"
      glass-backdrop: "radial-gradient(circle at 15% 10%, #7a2f8f 0, transparent 45%), radial-gradient(circle at 85% 20%, #2456b8 0, transparent 50%), radial-gradient(circle at 50% 95%, #12807a 0, transparent 55%), #0b1020"
      soft-shadow-dark: "rgba(0, 0, 0, 0.45)"
      soft-shadow-light: "rgba(255, 255, 255, 0.22)"
      soft-control-edge: "#8191a5"
      soft-scrim: "rgba(8, 12, 18, 0.66)"
      primary-color: "#6cb4ff"
      accent-color: "#6cb4ff"
      primary-text-color: "#edf3fa"
      secondary-text-color: "#b4c1d1"
      text-primary-color: "#08203d"
      disabled-text-color: "#8191a5"
      disabled-color: "#8191a5"
      divider-color: "#465467"
      outline-color: "#8191a5"
      outline-hover-color: "#b4c1d1"
      error-color: "#ff95a1"
      warning-color: "#f2c572"
      success-color: "#82d6a7"
      info-color: "#8ecbff"
      rgb-primary-color: "108, 180, 255"
      rgb-accent-color: "108, 180, 255"
      rgb-primary-text-color: "237, 243, 250"
      rgb-secondary-text-color: "180, 193, 209"
      rgb-text-primary-color: "8, 32, 61"
      rgb-card-background-color: "44, 56, 80"
      rgb-error-color: "255, 149, 161"
      rgb-warning-color: "242, 197, 114"
      rgb-success-color: "130, 214, 167"
      rgb-info-color: "142, 203, 255"
